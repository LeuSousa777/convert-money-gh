<!doctype html>
<html lang="pt-br">

  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <title>Convert-Money-GH</title>
  </head>

  <body>
      <img class="logo" src="./assets/logo.gif" alt="convert-money-gh" />

      <main>
        <label>
            Coverter <b>de</b>
            <select class="currency-select1">
                <option>R$ Real Brasileiro</option>
                <option>U$ Dolar Americano</option>
                <option>€ Euro</option>
                <option>£ Libra Esterlina</option>
                <option>₿ Bitcoin</option>
            </select>
        </label>

        <label>
            Coverter <b>para</b>
            <select class="currency-select">
                <option value="dolar">US$ Dolar Americano</option>
                <option value="euro">€ Euro</option>
                <option value="libra">£ Libra Esterlina</option>
                <option value="bitcoin">₿ Bitcoin</option>
                <!--<option value="real">R$ Real</option>-->
            </select>
        </label>

        <label>
            Valor
            <input class="input-currency" type="text" placeholder="0,00" />
        </label>

        <button class="convert-button">Converter</button>

        <section>
            <div class="currency-box">
                <img src="./assets/real.png" alt="logo-moeda-a-converter" />
                <p class="curancy">Real</p>
                <p class="curancy-value-to-convert">R$ 0,00</p>
            </div>
            
            <img class="arrow-img" src="./assets/arrow.png" alt="seta" />

            <div class="currency-box">
                <img class="currency-img" src="./assets/dolar.png" alt="logo-moeda-convertida" />
                <p class="curancy" id="currency-name">Dólar</p>
                <p class="curancy-value">US$ 0,00</p>
            </div>
        </section>
      </main>
      <script src="./scripts.js"></script>
  </body>
</html>
